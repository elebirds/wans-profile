x-template-id: wans-personal-v1
mode: rule
allow-lan: false
bind-address: 127.0.0.1
mixed-port: 7890
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true
  prefer-h3: false
  fake-ip-filter:
    - +.lan
    - +.local
    - +.home.arpa
    - localhost
    - +.localhost
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.apple.com
    - time.windows.com
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  direct-nameserver-follow-policy: true
  nameserver:
    - https://1.1.1.1/dns-query#DMIT 固定
    - https://8.8.8.8/dns-query#DMIT 固定
  nameserver-policy:
    rule-set:Lan: system
    +.lan: system
    +.local: system
    +.home.arpa: system
    rule-set:China:
      - https://223.5.5.5/dns-query
      - https://119.29.29.29/dns-query
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: false
  mtu: 1500
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
proxy-providers:
  MESL:
    type: inline
    payload:
      - name: MESL 未配置
        type: reject
  Sakura:
    type: inline
    payload:
      - name: Sakura 未配置
        type: reject
proxies: []
proxy-groups:
  - name: 日常使用
    type: select
    proxies:
      - 香港自动
      - DMIT 固定
      - MESL 选择
      - Sakura 选择
      - 家宽选择
      - 台湾自动
      - 新加坡自动
